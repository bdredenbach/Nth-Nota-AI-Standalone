<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nth Nota AI</title>
<link rel="stylesheet" href="style.css">
<script defer src="icons.js"></script><script defer src="phone.js"></script><script defer src="answer-quality.js"></script><script defer src="model.js"></script><script defer src="thoughts.js"></script><script defer src="conversation-tools.js"></script><script defer src="walkthrough.js"></script><script defer src="revision.js"></script><script defer src="rehearsal.js"></script><script defer src="phrases.js"></script><script defer src="predictions.js"></script><script defer src="studio.js"></script><script defer src="live.js"></script><script defer src="images.js"></script><script defer src="files.js"></script><script defer src="organizer.js"></script><script defer src="shelf.js"></script><script defer src="memory.js"></script><script defer src="chat-memory.js"></script><script defer src="app.js"></script>
</head>
<body>
<div id="app">
<header><div class="header-start"><button id="organizer-menu" data-action="org-menu" class="icon-btn" aria-label="Open navigation menu" aria-haspopup="dialog" aria-controls="dialog" aria-expanded="false" data-icon="menu"></button><button class="brand" data-action="home" aria-label="Nth Nota AI home"><span class="mark">N<span>✦</span></span><span>Nth Nota <b>AI</b></span></button></div><div class="header-actions"><button id="live-entry" class="live-entry" data-action="live-menu" data-icon="wave" aria-label="Start live voice">Live</button><button class="icon-btn" data-action="new" aria-label="New chat" data-icon="new"></button><button class="icon-btn" data-action="settings" aria-label="Settings" data-icon="sliders"></button></div></header>
<main id="main" tabindex="-1"></main>
<section id="live-panel" aria-label="Live voice" hidden>
<div class="voice-top"><span class="voice-label" id="voice-label">Live voice</span><button class="voice-switch" id="voice-switch" data-action="live-switch"><span id="live-switch-label">Live View</span></button></div>
<div class="voice-stage"><div class="voice-orb" aria-hidden="true"><div class="orb-shell"><div class="orb-core"></div></div></div><div class="voice-content"><h2 id="live-state" role="status" aria-live="polite"></h2><p id="live-caption"></p></div></div>
<div id="live-tools" class="live-tools"><button data-action="live-pin">Hold that thought</button><button id="ramble-toggle" data-action="ramble-toggle">Let me ramble</button><button data-action="bookmark">Leave it here</button></div>
<div id="walk-tools" class="live-tools" hidden><button data-action="walk-repeat">Repeat</button><button data-action="walk-note">Record a problem</button><button data-action="walk-done">Done</button></div>
<div class="voice-controls"><button id="live-mute" data-action="live-mute">Mute mic</button><button id="live-interrupt" data-action="live-interrupt">Interrupt</button><button data-action="live-end">End voice</button></div>
</section>
<section id="composer" aria-label="Message composer">
<div id="passage"></div>
<textarea id="question" aria-label="Your message" placeholder="Ask Nth Nota…" maxlength="2000" rows="1"></textarea>
<div class="tools"><button class="bare" data-action="attach" aria-label="Add an attachment" data-icon="plus"></button><button id="mode" data-action="mode"></button><span class="spacer"></span><button class="bare" data-action="voice" aria-label="Dictate a message" data-icon="mic"></button><button id="send" data-action="send" aria-label="Send message"></button></div>
</section>
<nav aria-label="Main navigation"><button data-action="chat" data-icon="chat">Chat</button><button data-action="desk" data-icon="desk">Desk</button><button data-action="history" data-icon="history">History</button></nav>
</div>
<div id="overlay" hidden><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
<div id="notice" role="status" aria-live="polite" hidden></div>
</body></html>
