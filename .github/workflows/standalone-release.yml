name: Standalone unsigned release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/standalone-release.yml', 'app/build.gradle']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and build the standalone application
        run: |
          node --test tests/*.test.cjs
          ./gradlew --no-daemon :app:testDebugUnitTest --tests com.nth.notaai.GatewayQuotaTest :app:assembleRelease
      - name: Check package and record build identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git rev-parse HEAD > dist/source-commit.txt
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/
          sdk_dir="$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)")"
          "$sdk_dir/aapt" dump badging dist/app-release-unsigned.apk > dist/package.txt
          grep "^package: name='com.nth.notaai'" dist/package.txt
          if grep -q '^application-debuggable' dist/package.txt; then exit 1; fi
          "$sdk_dir/zipalign" -c 4 dist/app-release-unsigned.apk
          cp "$sdk_dir/lib/apksigner.jar" dist/
          (cd dist && sha256sum app-release-unsigned.apk apksigner.jar) | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nth-nota-standalone-unsigned
          path: dist/
          retention-days: 7
          compression-level: 0
