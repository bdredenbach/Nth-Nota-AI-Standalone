name: Android 16 conversation regression
on:
  push:
    branches:
      - 'qa/android16-conversations-*'
permissions:
  contents: read
jobs:
  exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m venv /tmp/nota-regression
          /tmp/nota-regression/bin/pip install websockets==15.0.1
          echo /tmp/nota-regression/bin >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          git worktree add --detach /tmp/nota-before ed7fcc4c329f4d85616c4a1f58296726fa570eba
          cd /tmp/nota-before
          ./gradlew --no-daemon :app:assembleDebug
      - name: Ask Nota on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash tools/regression16/device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-conversation-results
          path: regression-evidence/
          retention-days: 7
